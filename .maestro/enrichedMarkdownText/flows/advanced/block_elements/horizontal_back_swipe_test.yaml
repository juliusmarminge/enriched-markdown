appId: swmansion.enriched.markdown.example
tags:
  - block
  - advanced
  - text
  - ios-only
---
# Code, table and math blocks keep scrolling and bouncing, and yield a fresh
# outward pan at the settled leading edge to the full-screen back gesture.
- launchApp

# Code block
- runFlow:
    file: '../../../subflows/horizontal_block_back_swipe.yaml'
    env:
      SWIPE_Y: '30%'

# Table
- runFlow:
    file: '../../../subflows/horizontal_block_back_swipe.yaml'
    env:
      SWIPE_Y: '46%'

# Display math
- runFlow:
    file: '../../../subflows/horizontal_block_back_swipe.yaml'
    env:
      SWIPE_Y: '56%'
