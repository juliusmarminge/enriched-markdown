appId: swmansion.enriched.markdown.example
tags:
  - block
  - advanced
  - text
---
- launchApp
- runFlow:
    file: '../../../../subflows/move_to_playground.yaml'
- runFlow:
    file: '../../../subflows/set_enriched_text_value.yaml'
    env:
      VALUE: "```typescript\nconst answer = 42;\nconsole.log(answer);\n```"
- tapOn:
    id: blur-button
- assertVisible: TypeScript
- runFlow:
    file: '../../../subflows/capture_or_assert_screenshot.yaml'
    env:
      SCREENSHOT_NAME: code_header_alignment
