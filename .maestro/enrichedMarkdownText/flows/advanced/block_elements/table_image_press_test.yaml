appId: swmansion.enriched.markdown.example
tags:
  - block
  - advanced
  - image
  - table
  - text
  - ios-only
---
# Table images fire onImagePress, nested in blockquotes too; a linked image fires onLinkPress.
- launchApp

- runFlow:
    file: '../../../../subflows/move_to_playground.yaml'

# Root table
- runFlow:
    file: '../../../subflows/table_image_press_case.yaml'
    env:
      VALUE: "| Preview |\n| --- |\n| ![Table preview](https://placehold.co/160x100.webp) |"
      TITLE: Image
      BODY: '(?s)Table preview.*https://placehold[.]co/160x100[.]webp'

# Table nested in two blockquotes
- runFlow:
    file: '../../../subflows/table_image_press_case.yaml'
    env:
      VALUE: "> > | Preview |\n> > | --- |\n> > | ![Nested preview](https://placehold.co/160x100.webp) |"
      TITLE: Image
      BODY: '(?s)Nested preview.*https://placehold[.]co/160x100[.]webp'

# Linked image keeps link behaviour
- runFlow:
    file: '../../../subflows/table_image_press_case.yaml'
    env:
      VALUE: "| Preview |\n| --- |\n| [![Linked preview](https://placehold.co/160x100.webp)](https://example.com/destination) |"
      TITLE: Link
      BODY: https://example.com/destination
