appId: swmansion.enriched.markdown.example
---
# Opens the horizontal blocks screen and drives one block at row SWIPE_Y:
# scroll inward, return to the leading edge (keeps scrolling and bouncing),
# then a fresh outward pan goes back to home.
- tapOn:
    id: home-block-horizontal
- swipe:
    start: 85%, ${SWIPE_Y}
    end: 65%, ${SWIPE_Y}
    duration: 1000
- assertVisible:
    id: horizontal-blocks-screen
- swipe:
    start: 25%, ${SWIPE_Y}
    end: 95%, ${SWIPE_Y}
    duration: 1000
- assertVisible:
    id: horizontal-blocks-screen
- swipe:
    start: 25%, ${SWIPE_Y}
    end: 95%, ${SWIPE_Y}
    duration: 1000
- assertVisible:
    id: home-screen
